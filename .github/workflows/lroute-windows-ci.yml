name: LRoute Windows CI
on:
  push:
    branches: [lroute-windows, lroute-windows-rebuild]
    paths:
      - "windows/**"
      - ".github/workflows/lroute-windows-ci.yml"
  pull_request:
    branches: [lroute-windows]
    paths:
      - "windows/**"
      - ".github/workflows/lroute-windows-ci.yml"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: lroute-windows-ci-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Verify .NET SDK
        run: dotnet --info
      - name: Build Windows application
        run: dotnet build windows/LRoute.Windows/LRoute.Windows.csproj -c Release
      - name: Publish self-contained Windows x64 app
        run: dotnet publish windows/LRoute.Windows/LRoute.Windows.csproj -c Release -r win-x64 --self-contained true -o artifacts/LRoute-win-x64
      - name: Bundle Xray-core Windows x64
        shell: pwsh
        run: |
          $version = "v26.10.31"
          $archive = Join-Path $env:RUNNER_TEMP "Xray-windows-64.zip"
          $destination = "artifacts/LRoute-win-x64"
          Invoke-WebRequest -Uri "https://github.com/XTLS/Xray-core/releases/download/$version/Xray-windows-64.zip" -OutFile $archive
          $extract = Join-Path $env:RUNNER_TEMP "xray-extract"
          Expand-Archive -Path $archive -DestinationPath $extract -Force
          New-Item -ItemType Directory -Path "$destination/xray" -Force | Out-Null
          Copy-Item -Path "$extract/*" -Destination "$destination/xray" -Recurse -Force
          if (!(Test-Path "$destination/xray/xray.exe")) { throw "xray.exe was not found in the official release archive." }
          if (!(Test-Path "$destination/xray/wintun.dll")) { throw "wintun.dll was not found; Windows TUN mode cannot run." }
          & "$destination/xray/xray.exe" version
      - name: Run parser and Xray configuration tests
        run: dotnet run --project windows/LRoute.Windows.Tests/LRoute.Windows.Tests.csproj -c Release -- "artifacts/LRoute-win-x64/xray/xray.exe"
      - name: Upload Windows x64 artifact
        uses: actions/upload-artifact@v4
        with:
          name: LRoute-win-x64
          path: artifacts/LRoute-win-x64/
          if-no-files-found: error
          retention-days: 14
