name: LRoute Windows CI
on:
  push:
    branches: [lroute-windows]
    paths:
      - "windows/**"
      - ".github/workflows/lroute-windows-ci.yml"
  pull_request:
    branches: [lroute-windows]
    paths:
      - "windows/**"
      - ".github/workflows/lroute-windows-ci.yml"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: lroute-windows-ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Verify .NET SDK
        run: dotnet --info
      - name: Build Windows application
        run: dotnet build windows/LRoute.Windows/LRoute.Windows.csproj -c Release
      - name: Publish self-contained Windows x64 app
        run: dotnet publish windows/LRoute.Windows/LRoute.Windows.csproj -c Release -r win-x64 --self-contained true -o artifacts/LRoute-win-x64
      - name: Upload Windows x64 artifact
        uses: actions/upload-artifact@v4
        with:
          name: LRoute-win-x64
          path: artifacts/LRoute-win-x64/
          if-no-files-found: error
          retention-days: 14
