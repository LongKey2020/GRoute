name: LRoute
options:
  bundleIdPrefix: net.gozar
  deploymentTarget:
    iOS: "16.0"
settings:
  base:
    SWIFT_VERSION: "5.9"
    IPHONEOS_DEPLOYMENT_TARGET: "16.0"
    TARGETED_DEVICE_FAMILY: "1,2"
packages:
  WireGuardKit:
    path: vendor/wireguard-apple
targets:
  LRoute:
    type: application
    platform: iOS
    sources:
      - path: ios/App
    dependencies:
      - target: LRoutePacketTunnel
      - package: WireGuardKit
        product: WireGuardKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: net.gozar.lroute
        PRODUCT_NAME: LRoute
        INFOPLIST_FILE: ios/App/Info.plist
        CODE_SIGN_ENTITLEMENTS: ios/App/LRoute.entitlements
        GENERATE_INFOPLIST_FILE: NO
        ENABLE_BITCODE: NO
  LRoutePacketTunnel:
    type: app-extension
    platform: iOS
    sources:
      - path: ios/PacketTunnel
    dependencies:
      - package: WireGuardKit
        product: WireGuardKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: net.gozar.lroute.PacketTunnel
        PRODUCT_NAME: LRoutePacketTunnel
        INFOPLIST_FILE: ios/PacketTunnel/Info.plist
        CODE_SIGN_ENTITLEMENTS: ios/PacketTunnel/PacketTunnel.entitlements
        APPLICATION_EXTENSION_API_ONLY: YES
        GENERATE_INFOPLIST_FILE: NO
        ENABLE_BITCODE: NO

  LRouteWireGuardTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: ios/Tests
      - path: ios/PacketTunnel/WireGuardConfigParser.swift
    dependencies:
      - target: LRoute
      - package: WireGuardKit
        product: WireGuardKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: net.gozar.lroute.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/LRoute.app/LRoute"
        BUNDLE_LOADER: "$(TEST_HOST)"
